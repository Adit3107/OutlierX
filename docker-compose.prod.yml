version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - subscription-service
      - ingestion-service
      - analytics-service
      - notification-service
      - admin-service
      - frontend
    restart: unless-stopped
    networks:
      - anomalyze-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    restart: unless-stopped
    networks:
      - anomalyze-net

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - anomalyze-net

  subscription-service:
    build:
      context: ./backend
      dockerfile: services/subscription-service/Dockerfile
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - anomalyze-net

  ingestion-service:
    build:
      context: ./backend
      dockerfile: services/ingestion-service/Dockerfile
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - anomalyze-net

  analytics-service:
    build:
      context: ./backend
      dockerfile: services/analytics-service/Dockerfile
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - anomalyze-net

  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - anomalyze-net

  admin-service:
    build:
      context: ./backend
      dockerfile: services/admin-service/Dockerfile
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - anomalyze-net

  # ML Service is python based so context is its own directory
  ml-api:
    build:
      context: ./backend/services/ml-api
      dockerfile: Dockerfile
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - anomalyze-net

networks:
  anomalyze-net:
    driver: bridge
