version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outlierx-frontend
    restart: always
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    networks:
      - outlierx-net

networks:
  outlierx-net:
    driver: bridge
